# ==========================================================
#  Nginx como "reverse proxy" de telosabes2026
#
#  Nginx escucha en el puerto 80 y manda las peticiones a
#  Spring Boot, que escucha en 127.0.0.1:8080.
#
#  Se instala en /etc/nginx/sites-available/telosabes2026
#  y se activa con un enlace en sites-enabled.
# ==========================================================

server {
    listen 80;
    listen [::]:80;
    server_name 212.227.99.111;

    # Los formularios de la aplicacion son pequenos, pero damos margen
    client_max_body_size 10M;

    access_log /var/log/nginx/telosabes2026.access.log;
    error_log  /var/log/nginx/telosabes2026.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Cabeceras para que la aplicacion sepa de donde viene la peticion
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # La aplicacion es sencilla: no necesitamos tiempo real
        proxy_read_timeout 120s;
    }
}
