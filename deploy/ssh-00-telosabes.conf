# Acceso SSH de telosabes2026.
#
# Este fichero se copia en /etc/ssh/sshd_config.d/00-telosabes.conf. El nombre
# empieza por 00 para que se lea antes que 50-cloud-init.conf (que pone
# PasswordAuthentication yes); sshd se queda con el primer valor que encuentra,
# asi que manda este.
#
# Se aplica con deploy/configurar-ssh.sh. El usuario root si puede entrar con
# contrasena; el resto de usuarios tienen que usar la clave SSH.

PubkeyAuthentication yes
PermitRootLogin yes

# Sin contrasena en general.
PasswordAuthentication no
KbdInteractiveAuthentication no

# Excepcion para root. El bloque Match va al final, como exige sshd.
Match User root
    PasswordAuthentication yes
