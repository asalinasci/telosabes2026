# Configuracion para los TESTS: base de datos H2 en memoria.
# Asi "mvnw test" funciona aunque MariaDB no este arrancado.
spring.datasource.url=jdbc:h2:mem:telosabes;DB_CLOSE_DELAY=-1;MODE=MariaDB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
