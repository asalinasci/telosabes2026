spring.application.name=telosabes2026

# ==========================================================
#  Base de datos MariaDB
# ==========================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/telosabes2026
spring.datasource.username=${DB_USER:telosabes}
spring.datasource.password=${DB_PASSWORD:telosabes}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# ==========================================================
#  JPA / Hibernate
# ==========================================================
# update = crea/actualiza las tablas automaticamente (ideal en desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
#  Thymeleaf
# ==========================================================
# cache=false para ver los cambios de HTML sin reiniciar la app
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ==========================================================
#  Servidor
# ==========================================================
server.port=8080
server.error.include-message=always

# ==========================================================
#  Log
# ==========================================================
logging.level.com.telosabes=DEBUG
