# ==========================================================
#  Perfil de produccion (VPS Ubuntu + Nginx)
#
#  Se activa con:  --spring.profiles.active=prod
#  y solo cambia algunos ajustes del application.properties
#  base (las credenciales de la base de datos siguen saliendo
#  de las variables de entorno DB_USER y DB_PASSWORD).
# ==========================================================

# La aplicacion solo escucha en localhost: delante va Nginx,
# que es quien recibe el trafico de internet.
server.address=127.0.0.1
server.port=8080

# Nginx manda las cabeceras X-Forwarded-*: con esto Spring las
# tiene en cuenta para que los enlaces y las redirecciones salgan
# con el host y el esquema correctos.
server.forward-headers-strategy=framework

# En produccion no queremos el SQL de depuracion ni las plantillas
# sin cache (que son mas lentas).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true

# Menos ruido en los logs
logging.level.com.telosabes=INFO
logging.level.org.hibernate=WARN
